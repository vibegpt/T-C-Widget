name: PolicyCheck release checks
on:
  push:
    branches: [main, release/policycheck-1.0.3]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:release
      - run: npm run test:release
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE: build-placeholder
          OPENAI_API_KEY: build-placeholder
      - run: npm ci --ignore-scripts
        working-directory: policycheck-mcp
      - run: npm pack --ignore-scripts
        working-directory: policycheck-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: policycheck-mcp-1.0.3
          path: policycheck-mcp/policycheck-mcp-1.0.3.tgz
